#db config for deployment on server
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerceappdb}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:JavaDeveloper@1998}

#ORM s/w specific properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#For Spring Boot 3.x
#spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

#debug logs
logging.level.org.springframework.security=debug

#image
project.image=images/

#spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


#JWT Security Key
jwt.secret=${JWT_SECRET}

jwt.access-token-expiration=9900000
jwt.refresh-token-expiration=604800000


#Swagger OpenAPI
#For sorting endpoints alphabetically
springdoc.swagger-ui.operationsSorter=alpha

#For sorting tags alphabetically
springdoc.swagger-ui.tagsSorter=alpha

#to remove doc expansion
springdoc.swagger-ui.doc-expansion=false

app.file.upload-dir=uploads

#Logging
logging.level.root=INFO
logging.level.com.app=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=whsec_ef29c14615d55a3e5c80584f9496a0c5c2a21d1b89a30e41b8f29c74b5f033ef
app.payment.success-url=http://localhost:8080/payment-success
app.payment.cancel-url=http://localhost:8080/payment-cancel

spring.profiles.active=dev